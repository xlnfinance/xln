name: build-and-test

on:
  # Owner policy: local verification before direct main pushes; no automatic CI.
  workflow_dispatch:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-test:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install contracts dependencies
        run: |
          cd jurisdictions
          bun install --frozen-lockfile

      - name: Build contracts
        run: bun run env:build

      - name: Verify frontend contract artifacts
        run: |
          bun frontend/copy-static-files.js --contracts-only --require-all-contract-sources
          git diff --exit-code -- frontend/static/contracts

      - name: Run full contract tests
        run: bun run test:contracts:full

  build-xln:
    name: Runtime Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Setup forge-std
        run: cd jurisdictions && bun run forge:setup

      - name: Install source-check tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run runtime source checks
        run: bun run check:src

      - name: Build TypeScript
        run: bun run build

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Cache frontend dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-frontend-bun-${{ hashFiles('bun.lock', 'package.json', 'frontend/bun.lock', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-bun-

      - name: Install root and frontend dependencies
        run: |
          bun install --frozen-lockfile
          cd frontend
          bun install --frozen-lockfile

      - name: Check frontend
        run: |
          cd frontend
          bun run check

      - name: Build frontend
        run: |
          cd frontend
          bun run build:static

  wallet-types:
    name: React Wallet Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The wallet resolves ../core and ../frontend/src sources, so their
      # dependencies (svelte/store among them) must be installed as well.
      - name: Install root, frontend and wallet dependencies
        run: |
          bun install --frozen-lockfile
          (cd frontend && bun install --frozen-lockfile)
          (cd ui && bun install --frozen-lockfile)

      - name: Typecheck React wallet
        run: |
          cd ui
          bun run check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install root, frontend and React wallet dependencies
        run: |
          bun install --frozen-lockfile
          (cd frontend && bun install --frozen-lockfile)
          (cd ui && bun install --frozen-lockfile)

      - name: Install contracts dependencies
        run: |
          cd jurisdictions
          bun install --frozen-lockfile

      - name: Build contracts
        run: bun run env:build

      # Bun segfaults when one process loads the whole test tree, so each
      # directory runs in its own process. Owner 2026-10-14 lifted the Rust
      # freeze. This job stays the TS suite; `rscore:check` is a separate gate
      # and is required once it is green on the pushed SHA. Real-runtime
      # lifecycle tests run separately under the machine-wide stand lock.
      - name: Run TS unit tests one directory per process
        run: |
          runtime_stands=(
            core/__tests__/development/dev/dev-anvil-shutdown.test.ts
            core/__tests__/operations/hlt/sovereign-runtime-host.test.ts
            core/__tests__/storage/durability/lending-real-crash-recovery.test.ts
          )
          ignore=()
          for file in "${runtime_stands[@]}"; do ignore+=("--path-ignore-patterns=**/$file"); done
          failed=()
          run_shard() {
            local label=$1
            shift
            echo "::group::$label"
            if ! bun test "$@" "${ignore[@]}"; then failed+=("$label"); fi
            echo "::endgroup::"
          }
          mapfile -t core_dirs < <(find core/__tests__ -mindepth 1 -maxdepth 1 -type d ! -name rscore | sort)
          for dir in "${core_dirs[@]}" tests/unit/ tests/frontend/ native/__tests__/; do
            if [ -n "$(find "$dir" -name '*.test.ts' -print -quit)" ]; then run_shard "$dir" "$dir"; fi
          done
          run_shard 'core/__tests__/*.test.ts' core/__tests__/*.test.ts
          for file in "${runtime_stands[@]}"; do
            echo "::group::$file"
            bun run stand:status
            runtime_wall_budget=180000
            # Five crash cases retain their individual 60-second test deadlines.
            if [ "$file" = core/__tests__/storage/durability/lending-real-crash-recovery.test.ts ]; then
              runtime_wall_budget=300000
            fi
            if ! bun run stand:run --reason ci-unit-runtime --timeout-ms "$runtime_wall_budget" -- bun test "$file"; then
              failed+=("$file")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::failed unit shards: ${failed[*]}"
            exit 1
          fi

  core-scenarios:
    name: Core scenarios without a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install contracts dependencies
        run: |
          cd jurisdictions
          bun install --frozen-lockfile

      - name: Build contracts
        run: bun run env:build

      - name: Setup Foundry for isolated RPC scenarios
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Run core financial and recovery scenarios
        run: bun run test:scenarios:core

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # The gate:ci step watchdogs add up to 74 minutes; the job cap
    # must stay above them so a slow step fails with its own named watchdog.
    timeout-minutes: 90
    needs: [build-xln, frontend-build, contracts-test]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Setup forge-std
        run: cd jurisdictions && bun run forge:setup

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend and React wallet dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
          cd ../ui
          bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Cache contract artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            jurisdictions/artifacts
            jurisdictions/cache
          key: ${{ runner.os }}-contracts-${{ hashFiles('jurisdictions/**/*.sol', 'jurisdictions/hardhat.config.*') }}
          restore-keys: |
            ${{ runner.os }}-contracts-

      - name: Build contracts for E2E
        run: |
          bun run env:build
          ./scripts/sync-contract-artifacts.sh
          # Clear any existing deployment cache to avoid reconciliation issues in CI
          rm -rf jurisdictions/ignition/deployments/chain-* || true

      - name: Run CI release gate
        run: bun run gate:ci
        env:
          CI: true

      - name: Print logs on failure
        if: failure()
        run: |
          find .logs -maxdepth 4 -type f -name '*.log' -print 2>/dev/null | head -20 | while read -r log; do
            echo "=== $log (last 120 lines) ==="
            tail -n 120 "$log" || true
          done

      - name: Upload E2E test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            .logs/gates/*.log
            .logs/gates/react-*/wallet-browser.log
            .logs/gates/react-*/wallet-results.json
            .logs/gates/react-*/wallet-artifact.json
            .logs/gates/react-*/wallet-artifacts/
            .logs/e2e-parallel/
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 7
