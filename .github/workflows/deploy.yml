name: Deploy XLN to GitHub Pages

# DISABLED - Using nginx deployment on xln.finance server
on:
  workflow_dispatch: # Manual trigger only
  # push:
  #   branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          
      - name: Install dependencies
        run: |
          cd frontend
          bun install
          
      - name: Build canonical frontend surfaces
        run: |
          cd frontend
          bun run build:static
          
      - name: Prepare canonical frontend artifact
        run: |
          # Clean dist directory to ensure no conflicts
          rm -rf dist
          mkdir -p dist
          # Copy the exact site/docs/wallet/ops build roots.
          cp -r frontend/build/* dist/
          # Verify deployment structure
          ls -la dist/
          echo "Canonical frontend artifact ready"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
