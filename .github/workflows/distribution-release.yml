name: Distribution release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the canonical source tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - name: Install source-check tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: jurisdictions
      - run: bun run check
      - run: bun run test:release-integrity
      - run: bun run foundation-release:publish-check

  mac-launcher-desktop-chrome:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: jurisdictions
      - run: bun run release:launcher:verify
      - name: Install macOS release signing identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$MACOS_KEYCHAIN_PASSWORD"
          test -n "$MACOS_NOTARY_KEY_BASE64"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/macos-signing.p12"
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xln-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/xln-signing.keychain-db"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xln-signing.keychain-db"
          security import "$RUNNER_TEMP/macos-signing.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/xln-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xln-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/xln-signing.keychain-db"
      - name: Build signed and notarized macOS release
        env:
          XLN_MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          XLN_MACOS_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          XLN_MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          XLN_MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bun scripts/native/build-platforms.ts desktop extension --package --smoke --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-macos
          path: |
            packages/npm/xlnfinance/*.tgz
            native/dist/desktop/*.zip
            native/dist/desktop/*.release-proof.json
            native/dist/chrome/*.zip
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: jurisdictions
      - run: bun run build
      - run: bun run build
        working-directory: frontend
      - name: Materialize Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xln-release.keystore"
      - name: Build signed Android release
        env:
          XLN_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/xln-release.keystore
          XLN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XLN_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XLN_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          XLN_ANDROID_SIGNER_CERT_SHA256: ${{ secrets.ANDROID_SIGNER_CERT_SHA256 }}
        run: bun scripts/native/build-platforms.ts android --package --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-android
          path: |
            native/dist/android/*.apk
            native/dist/android/*.release-proof.json
          if-no-files-found: error

  publish-github:
    needs: [mac-launcher-desktop-chrome, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.14 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          path: native/dist/release-assets
          merge-multiple: true
      - run: bun run release:manifest
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            native/dist/release-assets/*
            native/dist/release-manifest.json
            native/dist/SHA256SUMS
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          remote_sha="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          test "$remote_sha" = "$RELEASE_SHA"
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find native/dist/release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            native/dist/release-manifest.json \
            native/dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes
