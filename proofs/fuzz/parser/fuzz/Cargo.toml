[package]
name = "xln-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
xln-rscore-abi = { path = "../../../../rscore/crates/abi" }
xln-rscore-engine = { path = "../../../../rscore/crates/engine" }
xln-rscore-hanko = { path = "../../../../rscore/crates/hanko" }
xln-rscore-process = { path = "../../../../rscore/crates/process" }
xln-rscore-entity-kernel = { path = "../../../../rscore/crates/entity-kernel" }
xln-rscore-protocol = { path = "../../../../rscore/crates/protocol" }
xln-rscore-runtime = { path = "../../../../rscore/crates/runtime" }
hex = "0.4"
keccak-hasher = "0.15.3"
num-bigint = "0.4"
rlp = "0.6.1"
serde_json = "1.0"
sha2 = "0.10"
triehash = "0.8.4"

[lib]
path = "src/lib.rs"
name = "xln_parser_fuzz_harness"

[[bin]]
name = "hanko_envelope"
path = "fuzz_targets/hanko_envelope.rs"
test = false
doc = false
bench = false

