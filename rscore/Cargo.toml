[workspace]
members = ["crates/abi", "crates/batch", "crates/crypto", "crates/engine", "crates/entity-kernel", "crates/hanko", "crates/process", "crates/protocol", "crates/runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22.1"
hex = "0.4.3"
mimalloc = "0.1.52"
getrandom = "0.3.4"
form_urlencoded = "1.2.2"
num-bigint = "0.4.6"
num-integer = "0.1.46"
ryu-js = "1.0.2"
sha2 = { version = "0.10.9", features = ["asm"] }
sha3 = { version = "0.10.8", features = ["asm"] }
thiserror = "2.0.16"

[patch.crates-io]
# rusty-leveldb 4.0.1 samples iterator reads with a signed random period. A
# negative draw turns its refill loop into an unbounded symmetric random walk,
# making identical WAL restores randomly stall for seconds or minutes. Pin the
# upstream one-line fix until crates.io publishes it.
rusty-leveldb = { git = "https://github.com/dermesser/leveldb-rs.git", rev = "003fd12a3392f20ac6495dab36d8cee4ec4ff193" }

[profile.release]
codegen-units = 1
# Whole-workspace thin LTO made the smallest H1 source edit spend more than
# the hard 20-second gate in the final process link. Hot crates remain
# optimized at one codegen unit; live HLT, not linker folklore, is the
# authority for accepting this build configuration.
lto = false
panic = "unwind"
# Consensus arithmetic must fail identically in debug and production. This is
# a backstop, not a substitute for checked_add/checked_sub at financial
# boundaries: an overlooked overflow may halt, but it may never wrap a balance.
overflow-checks = true
# Symbols only; they cost nothing at runtime and make a profile readable.
debug = "line-tables-only"

# The operator binary is glue around the optimized Runtime/Entity/Account
# crates. Compiling that wrapper as one monolithic unit repeatedly exceeded
# the repository's 20-second hard gate after any Runtime edit. Keep the hot
# libraries at one codegen unit above, but compile independent process glue in
# parallel; thin LTO still sees the final program.
[profile.release.package.xln-rscore-process]
codegen-units = 16

# These two orchestration crates otherwise exceed the mandatory 20-second
# incremental build gate as single LLVM units. The financial engine and batch
# worker remain at one unit; authoritative live HLT must reject this setting if
# it causes a material runtime regression.
[profile.release.package.xln-rscore-entity-kernel]
codegen-units = 4

[profile.release.package.xln-rscore-runtime]
codegen-units = 8
