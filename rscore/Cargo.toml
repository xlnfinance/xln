[workspace]
members = ["crates/abi", "crates/batch", "crates/crypto", "crates/engine", "crates/entity-kernel", "crates/hanko", "crates/process", "crates/protocol", "crates/runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22.1"
hex = "0.4.3"
mimalloc = "0.1.52"
getrandom = "0.3.4"
num-bigint = "0.4.6"
num-integer = "0.1.46"
rayon = "1.12.0"
ryu-js = "1.0.2"
sha2 = { version = "0.10.9", features = ["asm"] }
sha3 = { version = "0.10.8", features = ["asm"] }
thiserror = "2.0.16"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
# Consensus arithmetic must fail identically in debug and production. This is
# a backstop, not a substitute for checked_add/checked_sub at financial
# boundaries: an overlooked overflow may halt, but it may never wrap a balance.
overflow-checks = true
# Symbols only; they cost nothing at runtime and make a profile readable.
debug = "line-tables-only"
