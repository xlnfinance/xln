[package]
name = "xln-rscore-entity-kernel"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bench = []

[dependencies]
aes-gcm = "0.10"
ethabi = "18.0.0"
hkdf = "0.12"
hex.workspace = true
num-bigint.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
xln-rscore-engine = { path = "../engine" }
xln-rscore-batch = { path = "../batch" }
xln-rscore-hanko = { path = "../hanko" }
xln-rscore-protocol = { path = "../protocol" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
