[package]
name = "xln-rscore-entity-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bench = []

[[bin]]
name = "rscore-orderbook-bench"
path = "src/bin/rscore-orderbook-bench.rs"
required-features = ["bench"]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
num-bigint.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
xln-rscore-engine = { path = "../engine" }
xln-rscore-batch = { path = "../batch" }
xln-rscore-protocol = { path = "../protocol" }

[dev-dependencies]
hex.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
