[package]
name = "xln-rscore-process"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["bench"]
bench = ["xln-rscore-entity-kernel/bench"]

[dependencies]
base64.workspace = true
getrandom.workspace = true
form_urlencoded.workspace = true
mimalloc.workspace = true
num-bigint.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
xln-rscore-abi = { path = "../abi" }
xln-rscore-batch = { path = "../batch" }
xln-rscore-engine = { path = "../engine" }
xln-rscore-entity-kernel = { path = "../entity-kernel" }
xln-rscore-protocol = { path = "../protocol" }
xln-rscore-runtime = { path = "../runtime" }
xln-rscore-crypto = { path = "../crypto" }
serde_json = "1.0"

[dev-dependencies]
hex.workspace = true

[[bin]]
name = "xlnrs"
path = "src/main.rs"
