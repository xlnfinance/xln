[package]
name = "xln-rscore-process"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
bench = []

[dependencies]
getrandom.workspace = true
mimalloc.workspace = true
num-bigint.workspace = true
sha2.workspace = true
thiserror.workspace = true
xln-rscore-abi = { path = "../abi" }
xln-rscore-batch = { path = "../batch" }
xln-rscore-engine = { path = "../engine" }
xln-rscore-entity-kernel = { path = "../entity-kernel" }
xln-rscore-protocol = { path = "../protocol" }

[dev-dependencies]
hex.workspace = true

[[bin]]
name = "xln-rscore"
path = "src/main.rs"

[[bin]]
name = "rscore-native-entity-replay"
path = "src/bin/rscore-native-entity-replay.rs"
required-features = ["bench"]
