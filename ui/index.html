<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<title>xln</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="xln" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('xln-ui-theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.dataset.theme = t;
					} else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
						document.documentElement.dataset.theme = 'light';
					}
					var d = JSON.parse(localStorage.getItem('xln-ui-design') || '{}');
					var root = document.documentElement.dataset;
					root.material = d.material || 'obsidian';
					root.accent = d.accent || 'indigo';
					root.numbers = d.numbers || 'sans';
					root.risk = d.risk || 'violet';
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
